name: 🎵 Playback / Source Issue
description: A specific track, playlist, or music source won't play.
title: "[Playback]: "
labels: ["bug", "playback", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For when a **particular track, playlist or source** fails, rather than PikaBoo being broken overall.

        Only the source and the link are required. 🔒 Don't paste private playlist links you'd rather keep off a public issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: Quick check
      options:
        - label: I tried a different track and the problem seems specific to this one.
  - type: dropdown
    id: source
    attributes:
      label: Which source?
      options:
        - YouTube
        - Spotify
        - SoundCloud
        - Apple Music
        - Deezer
        - Amazon Music
        - Radio station
        - Direct URL / other
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Track / playlist link or search query
      description: The exact input you gave PikaBoo.
      placeholder: "https://open.spotify.com/track/..."
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: What happened?
      options:
        - Bot replied "Track not found"
        - Bot replied "No route found"
        - Another error message
        - Bot joined but stayed silent
        - Audio started then cut out
        - Audio stutters or is distorted
        - Wrong track played
        - Only part of the playlist loaded
        - Bot left the channel unexpectedly
        - Other
  - type: dropdown
    id: kind
    attributes:
      label: What were you trying to play?
      options:
        - A single track
        - A playlist
        - An album
        - A live stream
        - A radio station
        - A search query (no link)
  - type: textarea
    id: message
    attributes:
      label: Error message or bot reply
      description: Paste it in, or attach a screenshot.
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Does it fail every time? Did it work before? Does the same track work from another source?
  - type: input
    id: when
    attributes:
      label: When did this happen?
      placeholder: "2025-02-20, around 21:30 IST"
  - type: dropdown
    id: plan
    attributes:
      label: Which plan are you on?
      options:
        - Free
        - Premium
        - Pro
        - Not sure
