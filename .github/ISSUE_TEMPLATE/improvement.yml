name: 🛠️ Improvement
description: Improve something that already exists — performance, wording, UX, reliability.
title: "[Improvement]: "
labels: ["improvement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For polishing something PikaBoo **already does**. Only two short fields are required.

        Something broken? → [Bug report](https://github.com/kaumini/PikaBoo-Music-Bot/issues/new?template=bug_report.yml)
        Something entirely new? → [Feature request](https://github.com/kaumini/PikaBoo-Music-Bot/issues/new?template=feature_request.yml)
  - type: input
    id: target
    attributes:
      label: What should be improved?
      placeholder: "The !queue embed"
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: How should it work instead?
      placeholder: Paginate the queue — 10 tracks per page with next/previous buttons.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How does it work today?
      description: Optional — what's wrong with the current behaviour.
      placeholder: The queue shows all tracks in one message, so it's unreadable past ~20 songs.
  - type: dropdown
    id: type
    attributes:
      label: What kind of improvement is this?
      options:
        - Performance / speed
        - Audio quality
        - Reliability / stability
        - Command output & embed design
        - Wording, clarity or error messages
        - Ease of use / fewer steps
        - Accessibility
        - Configuration & defaults
        - Website or dashboard
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context
      description: Before/after sketches are very welcome.
