name: ✨ Feature Request
description: Suggest a brand-new capability for PikaBoo.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for PikaBoo? We'd love to hear it. 🎶

        **Only one field is required** — everything else is optional context.

        Want to improve something that already exists instead? Use the
        [Improvement template](https://github.com/kaumini/PikaBoo-Music-Bot/issues/new?template=improvement.yml).
  - type: checkboxes
    id: preflight
    attributes:
      label: Quick check
      options:
        - label: I had a quick look for an existing request, and checked this isn't already on the [Commands](https://pikaboobot.netlify.app/commands) page.
  - type: textarea
    id: proposal
    attributes:
      label: What would you like PikaBoo to do?
      placeholder: A `!playlist save <name>` command that stores the current queue so it can be reloaded later.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Optional, but the pain point often shapes a better solution than the one you had in mind.
      placeholder: Our DJs re-add the same songs at the start of every event.
  - type: dropdown
    id: category
    attributes:
      label: Which area does this belong to?
      options:
        - Music playback
        - Queue management
        - Audio filters & effects
        - Playlists
        - Music sources / integrations
        - Radio stations
        - Moderation & DJ controls
        - Server configuration
        - Slash commands / button controls
        - Website or dashboard
        - Premium features
        - Other
  - type: textarea
    id: commands
    attributes:
      label: Proposed commands or interaction
      description: If your idea needs new commands or buttons, sketch them out.
      placeholder: |
        `!playlist save <name>` — save the current queue
        `!playlist load <name>` — reload a saved playlist
  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use it regularly
        - Blocking how we use PikaBoo today
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Examples from other bots, mockups, alternatives you've considered.
