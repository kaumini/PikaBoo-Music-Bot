name: 🐛 Bug Report
description: Something in PikaBoo is broken or behaving incorrectly.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make PikaBoo better! 🎵

        **Only the first two fields are required** — fill in whatever else you can, and skip the rest.
        Even a one-line report is useful.

        🔒 Never include your bot token, password or any other credentials.
        📈 If PikaBoo seems down entirely, check the [status page](https://pikaboobot.netlify.app/status) first.
  - type: checkboxes
    id: preflight
    attributes:
      label: Quick check
      options:
        - label: I had a quick look for an existing issue about this.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: A short description is fine.
      placeholder: When I run !play with a Spotify playlist link, the bot joins the channel but never starts playing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Roughly what you did — rough steps are much better than none.
      placeholder: |
        1. Join a voice channel
        2. Run `!play <link>`
        3. Bot joins but stays silent
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: Skip this if it's obvious from the above.
  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: "!play https://open.spotify.com/playlist/..."
  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      options:
        - Playback (play / pause / resume / skip / stop)
        - Queue (queue / clear / shuffle / remove)
        - Audio filters & effects (bassboost / nightcore / 8D / karaoke)
        - Volume
        - Button controls in the embed
        - Slash commands
        - 24/7 playback
        - Radio stations
        - Voice commands
        - DJ roles / permissions
        - Configuration (prefix / language / auto-join)
        - Website or dashboard
        - Other / not sure
  - type: dropdown
    id: source
    attributes:
      label: Which music source?
      options:
        - YouTube
        - Spotify
        - SoundCloud
        - Apple Music
        - Deezer
        - Amazon Music
        - Radio station
        - Not applicable
        - Not sure
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often, but not always
        - Rarely / happened once
  - type: dropdown
    id: plan
    attributes:
      label: Which plan are you on?
      options:
        - Free
        - Premium
        - Pro
        - Not sure
  - type: input
    id: when
    attributes:
      label: When did this happen?
      description: Date and rough time with your timezone — helps us find the matching logs.
      placeholder: "2025-02-20, around 21:30 IST"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, error messages or anything else
      description: Drag and drop images here. Blur anything private first.
