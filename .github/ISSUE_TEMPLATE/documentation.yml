name: 📝 Report a Docs Problem
description: Something on the website, docs or this README is wrong, unclear or missing.
title: "[Docs]: "
labels: ["documentation", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Docs issues are genuinely useful — if it confused you, it's confusing others too. 📖

        Only one field is required.
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Quote the current text if you can, and tell us where you saw it.
      placeholder: The Commands page still lists `!np`, but the bot says that command doesn't exist.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Link or section
      placeholder: https://pikaboobot.netlify.app/commands — Premium section
  - type: dropdown
    id: where
    attributes:
      label: Where is the problem?
      options:
        - README in this repository
        - Website — Documentation page
        - Website — Commands page
        - Website — Features page
        - Website — Premium page
        - Website — Updates page
        - Website — About / Team page
        - In-bot help (!help)
        - Terms of Service or Privacy Policy
        - Other
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Information is incorrect or out of date
        - Information is missing
        - Wording is confusing
        - Broken link or image
        - Typo or formatting problem
        - Other
  - type: textarea
    id: suggestion
    attributes:
      label: What should it say instead?
      description: A suggested rewrite makes this much faster to fix — but don't worry if you're not sure.
